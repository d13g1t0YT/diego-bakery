<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7f4" />
    <meta name="description" content="Diego Bakery: gestión integral del negocio y pedidos." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Diego Bakery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const REMOTE_LOADER = 'https://diego-bakery-api-clean-production.up.railway.app/app/remote-loader.js';

      async function boot() {
        const localDevelopment =
          location.protocol === 'http:' &&
          /^(localhost|127\.0\.0\.1|0\.0\.0\.0)$/.test(location.hostname);

        if (!localDevelopment) {
          try {
            const cacheBuster = Date.now().toString();
            await import(REMOTE_LOADER + '?v=' + cacheBuster);
            return;
          } catch (error) {
            console.warn('Diego Bakery: no se pudo cargar la versión remota; usando la versión incluida.', error);
          }
        }

        await import(/* @vite-ignore */ './local-loader.js');
      }

      void boot();
    </script>
  </body>
</html>
