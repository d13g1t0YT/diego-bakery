<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7f4" />
    <meta name="description" content="Diego Bakery: gestión integral del negocio y pedidos." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Diego Bakery</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" aria-live="polite">
        <div class="boot-mark">DB</div>
        <strong>Diego Bakery</strong>
        <span>Iniciando la aplicación…</span>
      </div>
    </div>
    <script type="module">
      async function boot() {
        const target = './local-loader.js?v=' + Date.now();
        try {
          await import(target);
        } catch (error) {
          console.error('Diego Bakery boot error', error);
          const root = document.getElementById('root');
          if (root) {
            root.innerHTML =
              '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui;background:#faf7f2;color:#30221c">' +
              '<div style="max-width:520px;text-align:center;background:#fffdf9;border:1px solid #e8ddd2;border-radius:24px;padding:28px">' +
              '<strong style="font-size:24px;display:block;margin-bottom:10px">Diego Bakery</strong>' +
              '<p>No se pudo iniciar la interfaz. Recarga la página para intentarlo de nuevo.</p>' +
              '<button onclick="location.reload()" style="border:0;border-radius:12px;background:#7a412d;color:#fff;padding:12px 18px;cursor:pointer">Recargar</button>' +
              '</div></div>';
          }
        }
      }
      void boot();
    </script>
  </body>
</html>
