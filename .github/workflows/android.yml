name: Build Diego Bakery Android

concurrency:
  group: diego-bakery-mobile-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Verify native frontend is bundled
        shell: bash
        run: |
          ! grep -R 'window.location.replace' dist
          ! grep -R 'diego-bakery-api-clean-production.up.railway.app/app/' dist

      - name: Verify native frontend is bundled
        shell: bash
        run: |
          ! grep -R 'window.location.replace' dist
          ! grep -R 'diego-bakery-api-clean-production.up.railway.app/app/' dist

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android project
        working-directory: app/android
        run: ./gradlew --no-daemon tasks

      - name: Build APK
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diego-bakery-android-${{ github.sha }}
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
