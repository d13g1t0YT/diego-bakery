name: Build Diego Bakery Desktop Windows

concurrency:
  group: diego-bakery-desktop-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package.json
            desktop/package.json

      - name: Build web app
        working-directory: app
        run: |
          npm install
          npm run build

      - name: Build Windows desktop package
        working-directory: desktop
        run: |
          npm install
          npm run dist:win

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: diego-bakery-windows-v1
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
          if-no-files-found: error
